<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crossreview</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--line:#d9dde3;--text:#1c2128;--mute:#667080;--accent:#2f6feb;
  --add:#e6f6ea;--add-t:#116329;--del:#fdecec;--del-t:#a4262c;--hunk:#eef2f8;
  --miss:#ffd33d;--warn-bg:#fff6d6;--warn-t:#7a5200;--ok:#1a7f37;--bad:#cf222e;--sel:#e7f0ff;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1318;--panel:#171c23;--line:#2c333d;--text:#dfe5ec;--mute:#8b96a5;--accent:#6ea4ff;
  --add:#12301c;--add-t:#7ee2a0;--del:#3a1719;--del-t:#ff9a9a;--hunk:#1d2530;
  --miss:#d4a72c;--warn-bg:#3a2f0b;--warn-t:#f0cf6b;--ok:#56d364;--bad:#ff7b72;--sel:#1b2a44;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI","Malgun Gothic",system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 7px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}
header .sp{flex:1}
.chip{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:12px;color:var(--mute);white-space:nowrap}
.chip b{color:var(--text)}
.chip.warn{background:var(--warn-bg);color:var(--warn-t);border-color:transparent}
#config,#info{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px}
#config[hidden],#info[hidden]{display:none}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side h3{margin:0 0 6px;font-size:13px}
.grid{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;align-items:center}
.grid label{color:var(--mute);font-size:12px}
.opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px}
.opts label{display:flex;gap:5px;align-items:center;color:var(--mute)}
.opts input[type=number]{width:60px}
.opts input[type=text]{width:260px}
.hint{color:var(--mute);font-size:12px;margin-top:6px}
#error{background:var(--del);color:var(--del-t);padding:8px 14px;white-space:pre-wrap;border-bottom:1px solid var(--line)}
#error[hidden]{display:none}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.card h3{margin:0 0 4px;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card ul{margin:4px 0;padding-left:18px}
.card li{overflow-wrap:anywhere}
.card .w{color:var(--warn-t);background:var(--warn-bg);border-radius:4px;padding:1px 5px;list-style:none;margin:2px 0 2px -18px}
.card details{margin-top:4px}
.card summary{cursor:pointer;color:var(--mute)}
.mono{font-family:Consolas,"D2Coding",ui-monospace,monospace;font-size:12px}
main{flex:1;display:flex;min-height:0}
aside{width:300px;min-width:220px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.filters{padding:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:2px 8px;font-size:12px;border-radius:10px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#list{overflow:auto;flex:1}
.item{padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
.item:hover{background:var(--bg)}
.item.sel{background:var(--sel)}
.item .nm{flex:1;min-width:0}
.item .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.item .nm .sub{color:var(--mute);font-size:11px}
.badge{font-size:11px;font-weight:600;border-radius:4px;padding:1px 5px;white-space:nowrap}
.b-same{color:var(--ok);border:1px solid var(--ok)}
.b-diff{color:var(--warn-t);background:var(--warn-bg)}
.b-only{color:#fff;background:var(--bad)}
#viewer{flex:1;display:flex;flex-direction:column;min-width:0}
#vhead{padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#vhead label{color:var(--mute);display:flex;gap:4px;align-items:center}
#panes{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane+.pane{border-left:1px solid var(--line)}
.ptitle{padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.ptitle .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ptitle .st{color:var(--mute);font-size:12px;white-space:nowrap}
.code{flex:1;overflow:auto;background:var(--panel)}
.code table{border-collapse:collapse;min-width:100%}
.code td{padding:0 6px;white-space:pre;vertical-align:top;font-family:Consolas,"D2Coding",ui-monospace,monospace;font-size:12px;line-height:18px}
.code td.n{color:var(--mute);text-align:right;user-select:none;width:1%;border-right:1px solid var(--line);opacity:.75}
.code tr.h td{background:var(--hunk);color:var(--mute);padding-top:2px;padding-bottom:2px}
.code tr.a td.c{background:var(--add);color:var(--add-t)}
.code tr.d td.c{background:var(--del);color:var(--del-t)}
.code tr.miss td.c{box-shadow:inset 4px 0 0 var(--miss);font-weight:700}
.code tr.miss td.n{background:var(--miss);color:#000;opacity:1}
.empty{padding:30px;color:var(--mute);text-align:center}
.legend{color:var(--mute);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;background:var(--miss);border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (max-width:900px){.sides,#panes{grid-template-columns:1fr}aside{width:200px}}
</style>
</head>
<body>
<header>
  <h1>crossreview</h1>
  <span id="chips"></span>
  <span class="sp"></span>
  <button id="btnConfig">추출 설정</button>
  <button id="btnInfo">구간 정보</button>
  <button id="btnOpen">JSON 열기</button>
  <button id="btnSave" disabled>JSON 저장</button>
  <input type="file" id="file" accept=".json" hidden>
</header>

<section id="config" hidden>
  <div class="sides">
    <div class="side" data-side="src"><h3>원본 (기능을 처음 개발한 쪽)</h3><div class="grid"></div></div>
    <div class="side" data-side="dst"><h3>대상 (횡전개한 쪽)</h3><div class="grid"></div></div>
  </div>
  <div class="opts">
    <label>컨텍스트 <input type="number" id="o_context" min="0" max="999" value="3"></label>
    <label><input type="checkbox" id="o_function_context"> 함수 전체 (-W)</label>
    <label><input type="checkbox" id="o_ignore_space"> 공백 변경 무시</label>
    <label>경로 매핑 <input type="text" id="o_path_map" placeholder="src/v1/=src/v2/, a.c=b.c"></label>
    <button class="primary" id="btnRun">diff 추출</button>
    <span id="busy" class="hint" hidden>추출 중…</span>
  </div>
  <div class="hint">구간 우선순위: range / commit → grep → base·head(PR 모드, merge-base 기준). commit·range·pathspec 은 쉼표로 여러 개 지정 (과거 → 최신 순).</div>
</section>
<div id="error" hidden></div>
<section id="info" hidden><div class="sides" id="infoBody"></div></section>

<main>
  <aside>
    <div class="filters">
      <input type="text" id="q" placeholder="파일 검색">
      <div class="seg" id="filter">
        <button data-f="all" class="on">전체</button>
        <button data-f="diff">차이 있음</button>
        <button data-f="only">한쪽만</button>
        <button data-f="same">동일</button>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <section id="viewer">
    <div id="vhead">
      <span id="vsum" class="chip">파일을 선택하세요</span>
      <span class="sp" style="flex:1"></span>
      <span class="legend"><i></i>반대쪽에 없는 변경 라인</span>
      <label><input type="checkbox" id="onlyChanged"> 변경 라인만</label>
      <label><input type="checkbox" id="syncScroll" checked> 스크롤 동기화</label>
    </div>
    <div id="panes">
      <div class="pane"><div class="ptitle" id="tS"></div><div class="code" id="cS"></div></div>
      <div class="pane"><div class="ptitle" id="tT"></div><div class="code" id="cT"></div></div>
    </div>
  </section>
</main>

<script>
"use strict";
var TOKEN = /*__TOKEN__*/null;      // 서버 모드일 때만 값이 들어온다
var bundle = /*__BUNDLE__*/null;
var $ = function (id) { return document.getElementById(id); };
var FIELDS = [["repo", "레포 경로", "."], ["base", "base", "origin/main"], ["head", "head", "HEAD"],
              ["commit", "commit", "sha1, sha2"], ["range", "range", "A..B, C..D"],
              ["grep", "grep", "이슈 키 (PROJ-123)"], ["pathspec", "pathspec", "src/, *.c"]];
var state = { filter: "all", q: "", sel: -1, visible: [] };

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function list(v) { return v.split(",").map(function (s) { return s.trim(); }).filter(Boolean); }

// ---------------------------------------------------------------- 설정 폼
document.querySelectorAll("#config .side").forEach(function (side) {
  var g = side.querySelector(".grid"), p = side.dataset.side;
  FIELDS.forEach(function (f) {
    var id = p + "_" + f[0], lb = el("label", "", f[1]), inp = el("input");
    lb.htmlFor = id; inp.type = "text"; inp.id = id; inp.placeholder = f[2];
    g.appendChild(lb); g.appendChild(inp);
  });
});
function formIds() {
  var ids = ["o_context", "o_function_context", "o_ignore_space", "o_path_map"];
  ["src", "dst"].forEach(function (p) { FIELDS.forEach(function (f) { ids.push(p + "_" + f[0]); }); });
  return ids;
}
function saveForm() {
  var o = {};
  formIds().forEach(function (id) { var e = $(id); o[id] = e.type === "checkbox" ? e.checked : e.value; });
  try { localStorage.setItem("crossreview.form", JSON.stringify(o)); } catch (e) {}
}
function loadForm() {
  var o = {};
  try { o = JSON.parse(localStorage.getItem("crossreview.form") || "{}"); } catch (e) {}
  formIds().forEach(function (id) {
    if (!(id in o)) return;
    var e = $(id);
    if (e.type === "checkbox") e.checked = o[id]; else e.value = o[id];
  });
}
function sideReq(p) {
  var v = function (n) { return $(p + "_" + n).value.trim(); };
  return { repo: v("repo") || ".", base: v("base") || null, head: v("head") || null,
           commits: list(v("commit")), ranges: list(v("range")), grep: v("grep") || null,
           pathspecs: list(v("pathspec")) };
}
function showError(msg) { $("error").hidden = !msg; $("error").textContent = msg || ""; }

$("btnRun").onclick = function () {
  saveForm(); showError("");
  var req = { src: sideReq("src"), dst: sideReq("dst"),
              context: parseInt($("o_context").value, 10) || 0,
              function_context: $("o_function_context").checked,
              ignore_space: $("o_ignore_space").checked,
              path_maps: list($("o_path_map").value) };
  $("btnRun").disabled = true; $("busy").hidden = false;
  fetch("/api/run", { method: "POST", body: JSON.stringify(req),
                      headers: { "Content-Type": "application/json", "X-Token": TOKEN } })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.error) showError(d.error); else setBundle(d); })
    .catch(function (e) { showError("서버에 연결할 수 없습니다: " + e); })
    .then(function () { $("btnRun").disabled = false; $("busy").hidden = true; });
};

// ---------------------------------------------------------------- 상단 버튼
$("btnConfig").onclick = function () { $("config").hidden = !$("config").hidden; };
$("btnInfo").onclick = function () { $("info").hidden = !$("info").hidden; };
$("btnOpen").onclick = function () { $("file").click(); };
$("file").onchange = function () {
  var f = this.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var d = JSON.parse(rd.result);
      if (!d.pairs || !d.source || !d.target) throw new Error("crossreview bundle 형식이 아닙니다");
      showError(""); setBundle(d);
    } catch (e) { showError("JSON 을 읽을 수 없습니다: " + e.message); }
  };
  rd.readAsText(f, "utf-8"); this.value = "";
};
$("btnSave").onclick = function () {
  var a = el("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json" }));
  a.download = "crossreview-bundle.json"; a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
};

// ---------------------------------------------------------------- 요약 / 구간 정보
function chip(label, value, cls) {
  var c = el("span", "chip" + (cls ? " " + cls : ""), label + " ");
  c.appendChild(el("b", "", String(value)));
  return c;
}
function renderInfo() {
  var chips = $("chips"); chips.textContent = "";
  var body = $("infoBody"); body.textContent = "";
  if (!bundle) return;
  var s = bundle.summary;
  [chip("짝", s.paired), chip("동일", s.identical), chip("원본에만", s.source_only),
   chip("대상에만", s.target_only)].forEach(function (c) { chips.appendChild(c); chips.appendChild(document.createTextNode(" ")); });
  if (s.warnings) chips.appendChild(chip("경고", s.warnings, "warn"));

  [["source", "원본"], ["target", "대상"]].forEach(function (k) {
    var sd = bundle[k[0]], card = el("div", "card"), h = el("h3", "", k[1]);
    h.appendChild(el("span", "chip", sd.mode));
    h.appendChild(el("span", "chip", "composed: " + sd.composed));
    h.appendChild(el("span", "chip", "파일 " + sd.stats.files + "  +" + sd.stats.additions + " −" + sd.stats.deletions));
    card.appendChild(h);
    card.appendChild(el("div", "mono", sd.repo));
    var ul = el("ul");
    sd.warnings.forEach(function (w) { ul.appendChild(el("li", "w", "⚠ " + w)); });
    sd.notes.forEach(function (n) { ul.appendChild(el("li", "", n)); });
    card.appendChild(ul);
    sd.segments.forEach(function (sg, i) {
      var d = el("details"), sm = el("summary", "", "구간 " + (i + 1) + ": " + sg.how + "  (커밋 " + sg.commits.length + "개)");
      d.appendChild(sm);
      var cl = el("ul", "mono");
      sg.commits.forEach(function (c) {
        cl.appendChild(el("li", "", c.sha.slice(0, 10) + (c.is_merge ? " [merge] " : " ") + c.subject + "  — " + c.author));
      });
      d.appendChild(cl); card.appendChild(d);
    });
    body.appendChild(card);
  });
  $("info").hidden = !(s.warnings > 0);      // 경고가 있으면 펼쳐서 보여준다
}

// ---------------------------------------------------------------- 파일 목록
function category(p) {
  if (p.kind !== "paired") return "only";
  return p.identical ? "same" : "diff";
}
function renderList() {
  var box = $("list"); box.textContent = ""; state.visible = [];
  if (!bundle) { box.appendChild(el("div", "empty", TOKEN ? "'추출 설정'에서 diff 를 추출하세요." : "'JSON 열기'로 bundle 을 불러오세요.")); return; }
  var q = state.q.toLowerCase();
  bundle.pairs.forEach(function (p, i) {
    var cat = category(p), name = (p.source_path || "") + " " + (p.target_path || "");
    if (state.filter !== "all" && state.filter !== cat) return;
    if (q && name.toLowerCase().indexOf(q) < 0) return;
    state.visible.push(i);
    var it = el("div", "item" + (i === state.sel ? " sel" : ""));
    it.dataset.i = i;
    var b = cat === "same" ? el("span", "badge b-same", "동일")
          : cat === "diff" ? el("span", "badge b-diff", Math.round(p.similarity * 100) + "%")
          : el("span", "badge b-only", p.kind === "source_only" ? "원본만" : "대상만");
    var nm = el("div", "nm"), a = el("div", "", "\u200e" + (p.source_path || p.target_path));
    nm.appendChild(a); nm.title = name.trim();
    if (p.kind === "paired" && p.source_path !== p.target_path) nm.appendChild(el("div", "sub", "\u200e→ " + p.target_path));
    it.appendChild(b); it.appendChild(nm);
    it.onclick = function () { select(i); };
    box.appendChild(it);
  });
  if (!state.visible.length) box.appendChild(el("div", "empty", "해당하는 파일이 없습니다."));
}
$("q").oninput = function () { state.q = this.value; renderList(); };
$("filter").onclick = function (e) {
  var f = e.target.dataset.f; if (!f) return;
  state.filter = f;
  this.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.f === f); });
  renderList();
};
document.addEventListener("keydown", function (e) {
  if (/INPUT|TEXTAREA/.test(e.target.tagName) || !state.visible.length) return;
  var d = (e.key === "ArrowDown" || e.key === "j") ? 1 : (e.key === "ArrowUp" || e.key === "k") ? -1 : 0;
  if (!d) return;
  e.preventDefault();
  var at = state.visible.indexOf(state.sel);
  var nx = at < 0 ? 0 : Math.min(state.visible.length - 1, Math.max(0, at + d));
  select(state.visible[nx]);
  var cur = document.querySelector(".item.sel"); if (cur) cur.scrollIntoView({ block: "nearest" });
});

// ---------------------------------------------------------------- diff 뷰
function norm(l) { return l[0] + l.slice(1).split(/\s+/).filter(Boolean).join(" "); }
function changedSet(f) {
  var s = {};
  if (f) f.hunks.forEach(function (h) { h.lines.forEach(function (l) {
    if ((l[0] === "+" || l[0] === "-") && l.slice(1).trim()) s[norm(l)] = 1;
  }); });
  return s;
}
function findFile(side, path) {
  if (!path) return null;
  var fs = bundle[side].files;
  for (var i = 0; i < fs.length; i++) if (fs[i].path === path) return fs[i];
  return null;
}
function renderPane(titleEl, codeEl, f, other, label, hasOther) {
  titleEl.textContent = ""; codeEl.textContent = "";
  titleEl.appendChild(el("span", "chip", label));
  if (!f) {
    codeEl.appendChild(el("div", "empty", "이 쪽에는 해당 파일의 변경이 없습니다."));
    return 0;
  }
  var path = el("span", "path", f.path); path.title = f.path;
  titleEl.appendChild(path);
  titleEl.appendChild(el("span", "st", f.status + (f.old_path ? " (← " + f.old_path + ")" : "") + "  +" + f.additions + " −" + f.deletions));
  if (f.binary) { codeEl.appendChild(el("div", "empty", "바이너리 파일")); return 0; }
  if (!f.hunks.length) { codeEl.appendChild(el("div", "empty", "내용 변경 없음 (이름/모드만 변경)")); return 0; }
  var onlyChanged = $("onlyChanged").checked, miss = 0, tb = el("table");
  f.hunks.forEach(function (h) {
    var tr = el("tr", "h"), td = el("td", "c");
    td.colSpan = 3;
    td.textContent = "@@ -" + h.old_start + "," + h.old_lines + " +" + h.new_start + "," + h.new_lines + " @@ " + h.section
                   + (h.segment != null ? "   [구간 " + (h.segment + 1) + "]" : "");
    tr.appendChild(td); tb.appendChild(tr);
    var o = h.old_start, n = h.new_start;
    h.lines.forEach(function (l) {
      var k = l[0], r = el("tr"), on = "", nn = "";
      if (k === "+") { nn = n++; r.className = "a"; }
      else if (k === "-") { on = o++; r.className = "d"; }
      else if (k === " ") { on = o++; nn = n++; if (onlyChanged) return; }
      else { if (onlyChanged) return; }
      if (hasOther && (k === "+" || k === "-") && l.slice(1).trim() && !other[norm(l)]) { r.className += " miss"; miss++; }
      r.appendChild(el("td", "n", on)); r.appendChild(el("td", "n", nn)); r.appendChild(el("td", "c", l));
      tb.appendChild(r);
    });
  });
  codeEl.appendChild(tb);
  return miss;
}
function select(i) {
  state.sel = i;
  document.querySelectorAll(".item").forEach(function (e) { e.classList.toggle("sel", +e.dataset.i === i); });
  var p = bundle.pairs[i], s = findFile("source", p.source_path), t = findFile("target", p.target_path);
  var both = !!(s && t);
  var m1 = renderPane($("tS"), $("cS"), s, changedSet(t), "원본", both);
  var m2 = renderPane($("tT"), $("cT"), t, changedSet(s), "대상", both);
  var sum = $("vsum"); sum.className = "chip";
  if (p.kind === "source_only") { sum.textContent = "원본에만 있는 변경 — 이식 누락 여부 확인"; sum.classList.add("warn"); }
  else if (p.kind === "target_only") { sum.textContent = "대상에만 있는 변경 — 원본에 없는 추가 수정"; sum.classList.add("warn"); }
  else if (p.identical) sum.textContent = "변경 라인 동일 (공백 제외)";
  else { sum.textContent = "유사도 " + Math.round(p.similarity * 100) + "% · 원본에만 " + m1 + "줄 / 대상에만 " + m2 + "줄"
         + (p.status_mismatch ? " · 상태 다름" : "") + " · 매칭: " + p.match_by; sum.classList.add("warn"); }
  $("cS").scrollTop = $("cT").scrollTop = 0;
}
$("onlyChanged").onchange = function () { if (state.sel >= 0) select(state.sel); };

// 스크롤 동기화 (비율 기준)
var lock = false;
function sync(a, b) {
  a.addEventListener("scroll", function () {
    if (!$("syncScroll").checked || lock) return;
    lock = true;
    var ra = a.scrollHeight - a.clientHeight, rb = b.scrollHeight - b.clientHeight;
    b.scrollTop = ra > 0 ? a.scrollTop / ra * rb : 0;
    b.scrollLeft = a.scrollLeft;
    requestAnimationFrame(function () { lock = false; });
  });
}
sync($("cS"), $("cT")); sync($("cT"), $("cS"));

// ---------------------------------------------------------------- 시작
function setBundle(b) {
  bundle = b; state.sel = -1;
  $("btnSave").disabled = !b;
  renderInfo(); renderList();
  ["tS", "tT", "cS", "cT"].forEach(function (id) { $(id).textContent = ""; });
  $("vsum").className = "chip"; $("vsum").textContent = "파일을 선택하세요";
  if (b) {
    $("config").hidden = true;
    var first = -1;                       // 차이가 있는 첫 파일부터 보여준다
    b.pairs.some(function (p, i) { if (category(p) !== "same") { first = i; return true; } return false; });
    if (first < 0 && b.pairs.length) first = 0;
    if (first >= 0) select(first);
  }
}
if (TOKEN) { loadForm(); $("config").hidden = !!bundle; }
else { $("btnConfig").hidden = true; }
setBundle(bundle);
if (TOKEN && !bundle) $("config").hidden = false;
</script>
